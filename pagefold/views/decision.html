<form class="decision $manualclass" action="/plans/$plan/decisions" method="post"
      data-item="$item" data-revision="$revision" data-rows="$rowsjson">
 <input type="hidden" name="revision" value="$revision">
 <input type="hidden" name="item" value="$item">
 <div class="decision-bar">
  <label>行裁决 <select name="choice" class="choice-select">$options</select></label>
  <button class="primary">保存裁决</button>
 </div>
 $editor
</form>
