<form id="decision-form-$item" class="decision" action="/plans/$plan/decisions" method="post" data-decision-form data-item="$item">
 <input type="hidden" name="revision" value="$revision">
 <input type="hidden" name="item" value="$item">
 <label for="choice-$item">行裁决 <select id="choice-$item" name="choice" data-choice-select aria-describedby="preview-$item">$options</select></label>
 <button type="submit">保存</button>
</form>
<div id="preview-$item" class="selection-preview" data-selection-preview data-for="choice-$item" aria-live="polite"></div>
