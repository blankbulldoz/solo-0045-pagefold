<section class="heading"><div><h1>三方合流工作区</h1><p>从祖本和两份分支创建计划，裁决主键行差异并重演 SQLite 候选。</p></div><form method="post" action="/demo"><button>载入示例</button></form></section>
<div class="work-grid">
  <section class="paper"><div class="panel-title"><h2>建立合流计划</h2><span class="tag">SQLite</span></div>
  <form class="new-plan" method="post" action="/plans">
    <label><span class="input-title">祖本</span><span class="input-desc">左右分支共同的原始镜像</span><select name="base" required>$choices</select></label>
    <label><span class="input-title">左支</span><span class="input-desc">从祖本分离的第一份镜像</span><select name="left" required>$choices</select></label>
    <label><span class="input-title">右支</span><span class="input-desc">从祖本分离的第二份镜像</span><select name="right" required>$choices</select></label>
    <button class="primary" type="submit">计算三方差异</button>
  </form></section>
  <aside class="paper"><div class="panel-title"><h2>镜像登记</h2></div>
    <form class="upload" id="image-upload"><label class="pick">选择 SQLite 文件<input type="file" name="image" accept=".sqlite,.sqlite3,.db" required></label><button type="submit">登记</button><p id="upload-status" aria-live="polite">独立镜像，每份上限 4 MiB。</p></form>
    <ul class="image-links">$images</ul>
  </aside>
</div>
<section class="workspace-history paper"><div class="panel-title"><h2>合流计划</h2></div><div class="plan-links">$plans</div></section>
<section class="heading port-heading"><div><h1>分支变更移植</h1><p>把上轮祖本到改动分支的修改带到新祖本，逐行交代保留/重新选择的处置与来源。</p></div><form method="post" action="/demo-port"><button>载入移植示例</button></form></section>
<div class="work-grid">
  <section class="paper"><div class="panel-title"><h2>建立移植计划</h2><span class="tag">PORT</span></div>
  <form class="new-plan" method="post" action="/ports">
    <label><span class="input-title">上轮祖本</span><span class="input-desc">改动分支所基于的旧祖本</span><select name="base" required>$choices</select></label>
    <label><span class="input-title">改动分支</span><span class="input-desc">携带要移植修改的分支</span><select name="left" required>$choices</select></label>
    <label><span class="input-title">新祖本</span><span class="input-desc">本轮要接收移植的目标镜像</span><select name="right" required>$choices</select></label>
    <button class="primary" type="submit">计算移植差异</button>
  </form></section>
  <aside class="paper"><div class="panel-title"><h2>移植计划</h2></div><div class="plan-links">$ports</div></aside>
</div>
